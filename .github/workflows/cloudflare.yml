name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # what ends up in the build; a docs or tooling commit does not redeploy (each deploy makes players refetch the bundle)
    paths:
      - 'packages/**'
      - '!packages/core/test/**'
      - 'assets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, in push order; a newer push replaces the one still waiting
concurrency:
  group: cloudflare-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.22.0
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        run: npx --yes wrangler@4.147.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
